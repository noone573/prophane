{% load ui %}
{% if messages %}
  <div class="messages" role="status">
    {% for message in messages %}
      <div class="alert alert-{% if message.level_tag == 'error' %}error{% else %}{{ message.level_tag|default:'info' }}{% endif %}">
        {% if message.level_tag == 'success' %}{% icon 'check' %}{% elif message.level_tag == 'error' or message.level_tag == 'warning' %}{% icon 'alert' %}{% else %}{% icon 'info' %}{% endif %}
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
